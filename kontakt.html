<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <nav class="navbar">

      <!--PcLogo-->
      <div class="logo"><a href="index.html">PcBuilds</a></div>

      <!--Hamburgare-->
      <div class="hamburger" id="hamburger">☰</div>

      <!--Meny-->
      <ul class="nav-menu" id="navMenu">
        <li><a href="kontakt.html">Kontakt</a></li>
        <li><a href="om oss.html">Om oss</a></li>
        <li><a href="hjälp.html">Hjälp</a></li>
        <li><a href="#" class="login-btn">Logga In</a></li>
      </ul>

    </nav>
  </header>

  <section class="contact-section">

  <div class="contact-wrapper">

    <!-- TOP -->
    <div class="contact-top">

      <div class="contact-info">
        <h1>Kontakt</h1>
        <p>Har du frågor om builds eller support? Hör av dig.</p>

        <div class="info-row">
          <p>Email: support@pcbuilds.se</p>
          <p>Discord: PcBuilds#1234</p>
          <p>Telefon: +46 70 123 45 67</p>
        </div>
      </div>

      <form class="contact-form">
        <input type="text" placeholder="Ditt namn" required />
        <input type="email" placeholder="Din email" required />
        <textarea placeholder="Ditt meddelande..." rows="5"></textarea>
        <button type="submit">Skicka</button>
      </form>

    </div>

    <!-- BOTTOM -->
    <div class="contact-bottom">

      <h2>Vanliga frågor</h2>

      <div class="faq-grid">

        <div class="faq-card">
          <h3>Svarstid?</h3>
          <p>1–24 timmar</p>
        </div>

        <div class="faq-card">
          <h3>Custom builds?</h3>
          <p>Ja, alltid.</p>
        </div>

        <div class="faq-card">
          <h3>Ändringar?</h3>
          <p>Innan order skickas.</p>
        </div>

      </div>

    </div>

  </div>

</section>

<script src="script.js"></script>

</body>
</html>
